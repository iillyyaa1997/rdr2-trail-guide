; Trail Guide — autopilot to the map waypoint (on horseback, on foot, driving a wagon)
; Put a waypoint on the map, then press the toggle: Arthur goes there by himself.
; Press it again — or move the left stick — and you have the reins back.

Enabled=1
; auto = the game's language; ru | en
Language=auto

; --- controls ---------------------------------------------------------------------------------------------------------
; Gamepad buttons (XInput names; PlayStation names work too): DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT A B X Y
; (CROSS CIRCLE SQUARE TRIANGLE) LB RB (L1 R1) L3 R3 START BACK. A combo: LB+DPAD_LEFT (all of them held).
ToggleButton=DPAD_LEFT
; 0 = on press; > 0 = hold this long (ms) before it starts/stops
ToggleHoldMs=0
; next speed while the autopilot runs
SpeedButton=DPAD_RIGHT
; Keyboard: a letter, a digit, F1..F24 or a virtual-key code (0x4B). NONE turns a key off.
ToggleKey=K
SpeedKey=L
; moving the stick (or WASD) past this much for TakeoverMs gives the reins back
StopOnTakeover=1
TakeoverStick=0.5
TakeoverMs=250
; keyboard keys that count as taking over (the game window must have the focus)
TakeoverKeys=W,A,S,D

; --- speeds (1 = slow, 2 = middle, 3 = fast) -----------------------------------------------------------------------------
HorseSpeed=2
FootSpeed=1
WagonSpeed=2
; the horse's speed (metres per second) the reins hold at each step: walk, trot, gallop
HorseGaits=1.6,4.5,9.0
; 1 = at the gallop step the horse still trots on bends and among trees/rocks (a gallop there can throw Arthur)
CarefulGallop=1
; a wagon or coach (metres per second), the same reins
WagonGaits=2.0,4.0,7.0
; on foot: the game's move blend ratio (1 walk, 2 run, 3 sprint)
FootSpeeds=1.0,2.0,3.0

; --- danger -----------------------------------------------------------------------------------------------------------
; stop when Arthur or the horse gets hurt, when someone attacks, when a predator comes within PredatorRange metres
StopOnDanger=1
PredatorRange=35
DamageToStop=3

; --- arrival and the rest -----------------------------------------------------------------------------------------------
; stop this many metres from the waypoint
ArriveHorse=12
ArriveFoot=3
ArriveWagon=15
ClearWaypointOnArrival=1
; 1 = the game's cinematic camera while the autopilot runs (the game's own cinematic button works anyway)
CinematicCamera=0
; seconds the short notices stay
NoticeMs=3000
DebugLog=0

; --- route (tuning) -------------------------------------------------------------------------------------------------------
; how the horse is led: 5 = the reins (the mod moves the horse's stick along a navmesh path; the only way that moves a
; horse Arthur rides). 0-4 are the game's tasks (they leave a ridden horse standing; kept for tests)
HorseMethod=5
; a wagon: 5 = the reins (the game's drive task leaves a wagon the player drives standing, 17.11); the reins look for a new path this often (ms); a path point counts as reached this close (m); speed taps at most this often
RepathMs=3000
PointReach=5
SpeedTapMs=600
; a light pull on the reins when the horse runs faster than the chosen gait (ms of the stop button)
BrakeTapMs=50
; a point this many degrees off the horse's nose = full stick to that side
SteerDegrees=35
; camera | horse: how the game reads the stick on horseback (camera: like on foot, checked 17.11)
SteerRelativeTo=camera
; 1 = steer through the gamepad as well (needed while the gamepad is the game's device: the game then ignores the
; simulated control values); the mod replaces the left stick only while the autopilot runs
PadSteering=1
FootMethod=0
; a wagon: 5 = the reins (the game's drive task leaves a wagon the player drives standing, 17.11)
WagonMethod=5
WagonDrivingFlags=0
; 1 = follow roads (the game's road network for wagons) while a road near Arthur heads toward the waypoint; across
; country otherwise. A road counts as near within RoadReach metres
FollowRoads=1
RoadReach=40
; long trips go in legs of this many metres (the navmesh is only there near Arthur; 300 m legs often found no path); RoadSnap=1 ends each leg on the
; nearest road the game's GPS knows
LegLength=150
RoadSnap=0
StuckMs=6000
StuckTries=4
