; Trail Guide — autopilot to the map waypoint (on horseback, on foot, driving a wagon)
; Put a waypoint on the map, then press the toggle: Arthur goes there by himself.
; Press it again — or move the left stick — and you have the reins back.

Enabled=1
; auto = the game's language; ru | en
Language=auto

; --- controls ---------------------------------------------------------------------------------------------------------
; Gamepad buttons (XInput names; PlayStation names work too): DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT A B X Y
; (CROSS CIRCLE SQUARE TRIANGLE) LB RB (L1 R1) L3 R3 START BACK. A combo: LB+DPAD_LEFT (all of them held).
ToggleButton=DPAD_LEFT
; 0 = on press; > 0 = hold this long (ms) before it starts/stops
ToggleHoldMs=0
; next speed while the autopilot runs
SpeedButton=DPAD_RIGHT
; Keyboard: a letter, a digit, F1..F24 or a virtual-key code (0x4B). NONE turns a key off.
ToggleKey=K
SpeedKey=L
; moving the stick (or WASD) past this much for TakeoverMs gives the reins back
StopOnTakeover=1
TakeoverStick=0.5
TakeoverMs=250

; --- speeds (1 = slow, 2 = middle, 3 = fast) -----------------------------------------------------------------------------
HorseSpeed=2
FootSpeed=1
WagonSpeed=2
; what each speed means to the game: move blend ratios for the horse and on foot, metres per second for a wagon
HorseSpeeds=1.0,2.0,3.0
FootSpeeds=1.0,2.0,3.0
WagonSpeeds=4,7,11

; --- danger -----------------------------------------------------------------------------------------------------------
; stop when Arthur or the horse gets hurt, when someone attacks, when a predator comes within PredatorRange metres
StopOnDanger=1
PredatorRange=35
DamageToStop=3

; --- arrival and the rest -----------------------------------------------------------------------------------------------
; stop this many metres from the waypoint
ArriveHorse=12
ArriveFoot=3
ArriveWagon=15
ClearWaypointOnArrival=1
; 1 = the game's cinematic camera while the autopilot runs (the game's own cinematic button works anyway)
CinematicCamera=0
; seconds the short notices stay
NoticeMs=3000
DebugLog=0

; --- route (tuning) -------------------------------------------------------------------------------------------------------
; how the horse is led: 0 = the game's 'go by any means', 1 = navmesh on the horse, 2 = follow roads (navmesh),
; 3 = navmesh on Arthur, 4 = 'any means' on the horse
HorseMethod=0
FootMethod=0
WagonMethod=0
WagonDrivingFlags=0
; > 0: long trips go in legs of this many metres, each leg ending on the nearest road
LegLength=0
RoadSnap=1
StuckMs=9000
StuckTries=4
